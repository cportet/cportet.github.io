name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the sitemap's lastmod is the date of the last content change

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Content validation (JSON, FR/EN completeness, keys) and unit tests.
      - name: Test
        run: dotnet test --project MyHomePage.Tests -c Release

      - name: Stamp build timestamp
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg ts "$timestamp" '.buildTimestamp = $ts' MyHomePage/wwwroot/appconfig.json > temp.json && mv temp.json MyHomePage/wwwroot/appconfig.json
          echo "/* Last updated: $timestamp */" >> MyHomePage/wwwroot/service-worker.published.js

      # sitemap.xml, llms.txt and llms-full.txt, from the content (ages and durations as of today).
      - name: Generate SEO files
        run: |
          lastmod=$(git log -1 --format=%cs -- MyHomePage/wwwroot/content MyHomePage/wwwroot/doc)
          dotnet run --project MyHomePage.Tools -c Release -- generate MyHomePage/wwwroot --lastmod "$lastmod"

      # Also prerenders every page to static HTML (BlazorWasmPreRendering.Build).
      - name: Publish
        run: dotnet publish MyHomePage/MyHomePage.csproj -c Release -o release --nologo

      - name: Fix prerendered English pages
        run: dotnet run --project MyHomePage.Tools -c Release --no-build -- postpublish release/wwwroot

      # .nojekyll: no Jekyll processing (it would drop _framework and _content). CNAME: custom domain.
      - name: Add GitHub Pages files
        run: |
          touch release/wwwroot/.nojekyll
          cp CNAME release/wwwroot/CNAME

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: release/wwwroot
          include-hidden-files: true  # keeps .nojekyll

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The deploy action works from a git repository: it needs a checkout, even though the site comes from the artifact.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Check GitHub Pages files
        run: test -f site/.nojekyll && test -f site/CNAME && test -f site/index.html && test -f site/resume.html

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: site

      # Tells Bing and the other IndexNow engines (DuckDuckGo, Ecosia, Yahoo…) that the pages of the sitemap changed.
      # The key file (wwwroot/<32 hex characters>.txt) must stay at the root of the site. Never fails the deployment.
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          body=$(python3 - site <<'PY'
          import json, os, re, sys
          site = sys.argv[1]
          host = open(os.path.join(site, 'CNAME')).read().strip()
          key = next(f[:-4] for f in sorted(os.listdir(site)) if re.fullmatch(r'[0-9a-f]{32}\.txt', f))
          urls = re.findall(r'<loc>([^<]+)</loc>', open(os.path.join(site, 'sitemap.xml'), encoding='utf-8').read())
          print(f'{len(urls)} URLs of {host}', file=sys.stderr)
          print(json.dumps({'host': host, 'key': key, 'keyLocation': f'https://{host}/{key}.txt', 'urlList': urls}))
          PY
          )
          for endpoint in https://api.indexnow.org/indexnow https://www.bing.com/indexnow; do
            curl -s -o /dev/null -w "$endpoint: HTTP %{http_code}\n" -H "Content-Type: application/json; charset=utf-8" -d "$body" "$endpoint"
          done
