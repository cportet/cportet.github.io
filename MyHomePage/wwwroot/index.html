<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />

    <!-- Title, description, Open Graph and JSON-LD are written per page (Components/Seo.razor) and prerendered at publish time. -->
    <base href="/" />

    <script>
        // Before anything renders: language from the URL, light/dark from the saved Fluent theme (or the system).
        (function () {
            var root = document.documentElement;
            if (/^\/en(\/|$)/i.test(location.pathname)) root.lang = 'en';
            try {
                var settings = JSON.parse(localStorage.getItem('fluentui-blazor:theme-settings') || 'null');
                var mode = settings && String(settings.mode || settings.Mode || '').toLowerCase();
                var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) root.classList.add('cp-dark-boot');
            } catch (e) { }
        })();
    </script>


    <meta name="msvalidate.01" content="F8FA9AB42FE9BD5F8345EAAC01A087E7" />
